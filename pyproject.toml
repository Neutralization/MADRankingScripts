[project]
name = "MADRankingScripts"
description = "https://github.com/Neutralization/MADRankingScripts"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.3.0",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "requests>=2.32.3",
    "selenium>=4.26.1",
]
[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/web/simple"

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = false

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]