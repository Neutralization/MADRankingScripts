[project]
name = "MADRankingScripts"
description = "https://github.com/Neutralization/MADRankingScripts"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arrow>=1.3.0",
    "lxml>=5.3.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    "requests>=2.32.3",
    "selenium>=4.26.1",
]
[tool.uv]
index-url = "https://mirrors.aliyun.com/pypi/web/simple"

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = false

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
pythonPlatform = "All"
include = ["."]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist","**/node_modules", "**/.*"]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "pandas-stubs>=3.0.5.260730",
    "pyright>=1.1.411",
    "ruff>=0.16.3",
